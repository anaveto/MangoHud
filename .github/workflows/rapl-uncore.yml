name: RAPL uncore test

on:
  push:
    branches: [test/rapl-uncore]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        M=mangohud-next/server/metrics
        mkdir -p out stub/spdlog
        printf '#pragma once\n#include <bits/stdc++.h>\n#define SPDLOG_ERROR(...) ((void)0)\n#define SPDLOG_WARN(...) ((void)0)\n#define SPDLOG_INFO(...) ((void)0)\n#define SPDLOG_TRACE(...) ((void)0)\n#define SPDLOG_DEBUG(...) ((void)0)\n' > stub/spdlog/spdlog.h
        g++ -O2 -static -std=c++20 -Istub -I$M -o out/rapl-uncore tools/rapl-uncore/main.cpp \
          $M/cpu/cpu.cpp $M/cpu/power/rapl.cpp $M/cpu/power/zenpower.cpp $M/cpu/power/zenergy.cpp $M/hwmon.cpp mangohud-next/server/common/helpers.cpp
        sha256sum out/* | tee out/SHA256SUMS
    - uses: actions/upload-artifact@v4
      with:
        name: rapl-uncore
        path: out/
